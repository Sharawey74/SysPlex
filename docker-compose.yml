# System Monitor - Two-Tier Architecture
# Run with: docker-compose up --build -d
# Prerequisites: Host API must be running natively (bash start-host-api.sh)

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: sysplex:latest
    container_name: sysplex-dashboard

    # No privileges: the dashboard renders, agents measure. Hardware access
    # lives on the host by design, so the container needs none of it.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # Volumes
    volumes:
      # Application data
      - ./data:/app/data
      - ./agents/go/bin:/app/agents/go/bin:ro

    # Network configuration
    ports:
      - "5000:5000" # Web dashboard

    # Enable connection to Host API running on native OS
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - HOST_API_URL=http://host.docker.internal:8888
      - NATIVE_AGENT_URL=http://host.docker.internal:8889
      - USE_NATIVE_AGENT=false
      - HOST_MONITORING=true
      - JSON_LOGGING_ENABLED=true
      - JSON_LOG_INTERVAL=60

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Post-startup messages
    labels:
      - "org.opencontainers.image.title=SysPlex dashboard"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # JSON Logger Service - Background metrics logging
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: sysplex:latest
    container_name: sysplex-collector
    command: python3 -m server.collector

    # Mount json directory for logging
    volumes:
      - ./data:/app/data

    # Enable connection to Host API
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - HOST_API_URL=http://host.docker.internal:8888
      - JSON_LOGGING_ENABLED=true
      - JSON_LOG_INTERVAL=60

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Depends on dashboard
    depends_on:
      - dashboard

networks:
  default:
    name: sysplex-network
